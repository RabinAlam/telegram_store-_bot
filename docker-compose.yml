services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tz
      POSTGRES_PASSWORD: tzsecret
      POSTGRES_DB: tzstore
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tz:tzsecret@postgres:5432/tzstore
      REDIS_URL: redis://redis:6379
    ports: ['4000:4000']
    depends_on: [postgres, redis]
  admin:
    build: ./admin
    ports: ['8080:80']
    depends_on: [api]
  nginx:
    image: nginx:alpine
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['80:80']
    depends_on: [api, admin]
volumes:
  pgdata:
